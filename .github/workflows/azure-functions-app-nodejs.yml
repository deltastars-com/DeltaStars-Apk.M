# This Azure Functions workflow is DISABLED.
# This project deploys as a static site to GitHub Pages + Netlify serverless functions.
# The correct workflows are: deploy-pages.yml, build-android.yml, build-ios.yml, release.yml

name: Deploy Node.js project to Azure Function App (DISABLED)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "confirm" to run this legacy workflow'
        required: false

env:
  AZURE_FUNCTIONAPP_NAME: 'deltastars-store'
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.'
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    if: github.event.inputs.confirm == 'confirm'
    runs-on: ubuntu-latest
    environment: dev
    steps:
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@v4

    - name Setup Node ${{ env.NODE_VERSION }} Environment
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: 'Resolve Project Dependencies Using Npm'
      shell: bash
      run: |
        pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
        npm install
        sh ./scripts/build-web.sh
        popd

    - name: 'Run Azure Functions Action'
      uses: Azure/functions-action@v1
      id: fa
      with:
        app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
        package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
