name: Build iOS App

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Sync web assets
        run: npm run build:web

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Get version
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Build iOS App (Archive)
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/DeltaStars.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          # Find the .app inside the archive
          APP_PATH=$(find ios/App/build/DeltaStars.xcarchive/Products/Applications -name "*.app" -maxdepth 1 | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app not found in archive"
            find ios/App/build -name "*.app" 2>/dev/null
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r deltastars-v${VERSION}-ios.zip Payload/
          rm -rf Payload

      - name: Upload iOS Archive
        uses: actions/upload-artifact@v4
        with:
          name: deltastars-ios-archive
          path: ios/App/build/DeltaStars.xcarchive

      - name: Upload iOS ZIP
        uses: actions/upload-artifact@v4
        with:
          name: deltastars-ios-zip
          path: deltastars-v${{ steps.version.outputs.VERSION }}-ios.zip

      - name: Update GitHub Release with iOS
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            deltastars-v${{ steps.version.outputs.VERSION }}-ios.zip
          draft: false
          prerelease: false
