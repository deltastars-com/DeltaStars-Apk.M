name: Build iOS App

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Sync web assets
        run: npm run build:web

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Get version
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Build iOS App
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath build/DeltaStars.xcarchive \
            archive

      - name: Create IPA directory structure
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          mkdir -p Payload
          cp -r ios/App/build/DeltaStars.xcarchive/Products/Applications/DeltaStars.app Payload/
          zip -r deltastars-v${VERSION}-ios.zip Payload/
          rm -rf Payload

      - name: Upload iOS Archive
        uses: actions/upload-artifact@v4
        with:
          name: deltastars-ios-archive
          path: ios/App/build/DeltaStars.xcarchive

      - name: Upload iOS ZIP
        uses: actions/upload-artifact@v4
        with:
          name: deltastars-ios-zip
          path: deltastars-v${{ steps.version.outputs.VERSION }}-ios.zip

      - name: Update GitHub Release with iOS
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            deltastars-v${{ steps.version.outputs.VERSION }}-ios.zip
          draft: false
          prerelease: false
