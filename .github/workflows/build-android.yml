name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Sync web assets
        run: npm run build:web

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Get version
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create full release zip
        run: |
          zip -r deltastars-v${{ steps.version.outputs.VERSION }}-full.zip \
            index.html \
            robots.txt \
            security.txt \
            sitemap.xml \
            terms-of-service.html \
            privacy-policy.html \
            manifest.json \
            package.json \
            assets/ \
            android/app/build/outputs/apk/debug/app-debug.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            capacitor.config.ts \
            scripts/ \
            -x "*.DS_Store"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: deltastars-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: deltastars-release-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Full Release
        uses: actions/upload-artifact@v4
        with:
          name: deltastars-full-release
          path: deltastars-v${{ steps.version.outputs.VERSION }}-full.zip

      - name: Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            deltastars-v${{ steps.version.outputs.VERSION }}-full.zip
          draft: false
          prerelease: false
