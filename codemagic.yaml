workflows:
  # ══════════════════════════════════════════════════════════════
  # Android Build & Release
  # ══════════════════════════════════════════════════════════════
  android-release:
    name: Android Build & Publish
    instance_type: linux_x2
    max_build_duration: 180
    environment:
      android_signing:
        - deltastars_keystore
      vars:
        PACKAGE_NAME: "com.deltastars.store"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
        - pattern: develop
          include: true
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Set up Node.js
        script: |
          nvm install 22
          nvm use 22
      - name: Install dependencies
        script: npm install
      - name: Build web assets
        script: npm run build:web
      - name: Sync Capacitor Android
        script: npx cap sync android
      - name: Build Debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Build Release APK
        script: |
          cd android
          ./gradlew assembleRelease
      - name: Get version
        script: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $CM_ENV
    artifacts:
      - android/app/build/outputs/apk/debug/**/*.apk
      - android/app/build/outputs/apk/release/**/*.apk
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        status: draft
      email:
        recipients:
          - info@deltastars.store
        notify:
          success: true
          failure: true

  # ══════════════════════════════════════════════════════════════
  # iOS Build & Release
  # ══════════════════════════════════════════════════════════════
  ios-release:
    name: iOS Build & Publish
    instance_type: mac_pro_m1
    max_build_duration: 180
    environment:
      vars:
        BUNDLE_ID: "com.deltastars.store"
      groups:
        - deltastars_app_store
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Set up Node.js
        script: |
          nvm install 22
          nvm use 22
      - name: Install dependencies
        script: npm install
      - name: Build web assets
        script: npm run build:web
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Build iOS App
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath build/DeltaStars.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="$APPLE_DEVELOPER_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$APPLE_PROVISIONING_PROFILE"
      - name: Export IPA
        script: |
          cd ios/App
          xcodebuild -exportArchive \
            -archivePath build/DeltaStars.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/
    artifacts:
      - ios/App/build/*.xcarchive
      - ios/App/build/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_API_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
      email:
        recipients:
          - info@deltastars.store
        notify:
          success: true
          failure: true

  # ══════════════════════════════════════════════════════════════
  # Web Deploy
  # ══════════════════════════════════════════════════════════════
  web-deploy:
    name: Web Deploy
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      vars:
        SITE_NAME: deltastars-store
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Set up Node.js
        script: |
          nvm install 22
          nvm use 22
      - name: Install dependencies
        script: npm install
      - name: Build web assets
        script: npm run build:web
    artifacts:
      - index.html
      - assets/**
      - manifest.json
      - service-worker.js
      - robots.txt
      - sitemap.xml
    publishing:
      email:
        recipients:
          - info@deltastars.store
        notify:
          success: true
          failure: true
